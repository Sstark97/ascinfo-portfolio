name: Sync Notion Content

on:
  # Cron: Rebuild automático cada 6 horas
  schedule:
    - cron: '0 */6 * * *'  # A las 00:00, 06:00, 12:00, 18:00 UTC

  # Manual: Permite ejecutar manualmente desde GitHub UI
  workflow_dispatch:

jobs:
  rebuild:
    name: Trigger Vercel Rebuild
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Vercel Deploy
        run: |
          curl -X POST ${{ secrets.VERCEL_DEPLOY_HOOK }}
          echo "✅ Deploy triggered successfully!"

      - name: Notify
        run: |
          echo "🔄 Vercel is now rebuilding with latest Notion content"
          echo "⏱️  Build will complete in ~2-3 minutes"
